# Publica la app en GitHub Pages cada vez que se sube algo a main o a test:
#   rama main → https://navimaps.github.io/
#   rama test → https://navimaps.github.io/test/
# Además corre sola cada 30 minutos para actualizar alturas.json (alturas del río del INA y mareas del SHN):
# el archivo se arma al publicar, no se guarda en el repositorio (así no se llena de commits).
name: Publicar

on:
  push:
    branches: [main, test]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Bajar rama main
        uses: actions/checkout@v7
        with:
          ref: main
          path: main

      - name: Bajar rama test
        id: test
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: test
          path: test

      - name: Armar el sitio (main en la raíz, test en /test/)
        run: |
          mkdir -p sitio
          rsync -a --exclude .git --exclude .github --exclude scripts main/ sitio/
          if [ "${{ steps.test.outcome }}" = "success" ]; then
            mkdir -p sitio/test
            rsync -a --exclude .git --exclude .github --exclude scripts test/ sitio/test/
          fi
          touch sitio/.nojekyll
          find sitio -maxdepth 2 -type f | sort

      - name: Bajar alturas del río (INA) y mareas (SHN)
        continue-on-error: true
        run: |
          # Si una fuente falla, el script conserva lo que había en la versión publicada.
          # Si falla todo el script, se vuelve a publicar el alturas.json anterior tal cual.
          SCRIPT=main/scripts/alturas.py; [ -f "$SCRIPT" ] || SCRIPT=test/scripts/alturas.py
          python3 "$SCRIPT" sitio/alturas.json https://navimaps.github.io/alturas.json \
            || curl -fsS -o sitio/alturas.json https://navimaps.github.io/alturas.json \
            || echo "Sin alturas.json esta vez"
          if [ -f sitio/alturas.json ] && [ -d sitio/test ]; then cp sitio/alturas.json sitio/test/alturas.json; fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: sitio

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v5
