# Publica la app en GitHub Pages cada vez que se sube algo a main o a test:
#   rama main → https://iangiribaldi.github.io/Maps-nautico/
#   rama test → https://iangiribaldi.github.io/Maps-nautico/test/
name: Publicar

on:
  push:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Bajar rama main
        uses: actions/checkout@v7
        with:
          ref: main
          path: main

      - name: Bajar rama test
        id: test
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: test
          path: test

      - name: Armar el sitio (main en la raíz, test en /test/)
        run: |
          mkdir -p sitio
          rsync -a --exclude .git --exclude .github main/ sitio/
          if [ "${{ steps.test.outcome }}" = "success" ]; then
            mkdir -p sitio/test
            rsync -a --exclude .git --exclude .github test/ sitio/test/
          fi
          touch sitio/.nojekyll
          find sitio -maxdepth 2 -type f | sort

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: sitio

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v5
