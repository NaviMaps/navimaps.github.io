<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Delta">
<meta name="theme-color" content="#0a7c8c">
<title>Mapa del Delta</title>
<style>
:root{--bg:#eef3f4;--grid:#cfdcde;--fg:#13262b;--panel:#ffffff;--accent:#0a7c8c;--muted:#5d7479;--danger:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1d;--grid:#1d2f34;--fg:#e4eff1;--panel:#18272b;--accent:#35b6c7;--muted:#8ea8ad;--danger:#ef7a6c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a1d;--grid:#1d2f34;--fg:#e4eff1;--panel:#18272b;--accent:#35b6c7;--muted:#8ea8ad;--danger:#ef7a6c;color-scheme:dark}
*{-webkit-tap-highlight-color:transparent}
html,body,#root{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#app{position:relative;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.cross{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;pointer-events:none;opacity:.8}
.cross:before,.cross:after{content:"";position:absolute;background:var(--accent)}
.cross:before{left:11px;top:0;width:2px;height:24px}.cross:after{top:11px;left:0;height:2px;width:24px}
.hud{position:absolute;left:10px;top:10px;background:var(--panel);border-radius:12px;padding:8px 12px;box-shadow:0 2px 8px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:4px;min-width:96px}
.hud b{font-size:20px;font-variant-numeric:tabular-nums}.hud small{color:var(--muted);font-size:12px}
.scale{height:6px;border:2px solid var(--fg);border-top:none;margin-top:2px;box-sizing:content-box}
.fabs{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px}
.fab{width:48px;height:48px;border-radius:50%;border:none;background:var(--panel);color:var(--fg);font-size:22px;box-shadow:0 2px 8px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.94)}
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-radius:18px 18px 0 0;box-shadow:0 -2px 14px rgba(0,0,0,.25);padding:6px 12px 12px;display:flex;flex-direction:column;gap:10px;max-height:60%}
#handle{height:22px;display:flex;align-items:center;justify-content:center}
#handle i{width:40px;height:5px;border-radius:3px;background:var(--grid)}
.row{display:flex;gap:10px}
.btn{flex:1;min-height:48px;border:1px solid var(--grid);background:var(--panel);color:var(--fg);border-radius:12px;font-size:16px;font-weight:600}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.rec{background:var(--danger);border-color:var(--danger);color:#fff}
#more{display:none;flex-direction:column;gap:10px;min-height:0}
#sheet.open #more{display:flex}
input{flex:1;min-width:0;min-height:46px;padding:0 12px;border-radius:12px;border:1px solid var(--grid);background:var(--bg);color:var(--fg);font-size:16px;-webkit-user-select:text;user-select:text}
#list{overflow:auto;-webkit-overflow-scrolling:touch;max-height:28vh}
.item{display:flex;align-items:center;gap:8px;min-height:48px;border-top:1px solid var(--grid);font-size:16px}
.item span{flex:1;padding:10px 0}.item small{color:var(--muted)}
.item button{width:44px;height:44px;border:none;background:none;color:var(--danger);font-size:18px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:.95}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
(function(){
var useState=React.useState,useEffect=React.useEffect,useRef=React.useRef;
var html=htm.bind(React.createElement);
var dpr=Math.min(window.devicePixelRatio||1,3);
var DIRS=['N','NE','E','SE','S','SO','O','NO'];
var NICE=[1,2,5,10,20,50,100,200,500,1000,2000,5000,10000,20000,50000,100000];

function W(z){return 256*Math.pow(2,z)}
function px(lat,lng,z){var w=W(z),s=Math.sin(lat*Math.PI/180);return{x:(lng+180)/360*w,y:(0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*w}}
function ll(x,y,z){var w=W(z),n=Math.PI-2*Math.PI*y/w;return{lat:180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n))),lng:x/w*360-180}}
function dist(a,b){var R=6371,t=Math.PI/180,dl=(b.lat-a.lat)*t,dn=(b.lng-a.lng)*t,x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dn/2)*Math.sin(dn/2);return 2*R*Math.asin(Math.sqrt(x))}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function load(){try{return JSON.parse(localStorage.getItem('delta')||'null')||{}}catch(e){return {}}}

function App(){
  var sv=useRef(null);if(!sv.current)sv.current=load();
  var V=useRef({lat:sv.current.lat||-34.38,lng:sv.current.lng||-58.57,z:sv.current.z||11});
  var _m=useState(sv.current.marks||[]),marks=_m[0],setMarks=_m[1];
  var _t=useState(sv.current.track||[]),track=_t[0],setTrack=_t[1];
  var _me=useState(null),me=_me[0],setMe=_me[1];
  var _r=useState(false),rec=_r[0],setRec=_r[1];
  var _k=useState(0),km=_k[0],setKm=_k[1];
  var _s=useState('0.0'),spd=_s[0],setSpd=_s[1];
  var _o=useState(false),open=_o[0],setOpen=_o[1];
  var _n=useState(''),name=_n[0],setName=_n[1];
  var _to=useState(''),toast=_to[0],setToast=_to[1];
  var _sa=useState(false),sat=_sa[0],setSat=_sa[1];
  var _w=useState(null),wx=_w[0],setWx=_w[1];
  var satR=useRef(false);

  var cv=useRef(null),sc=useRef(null),scl=useRef(null),raf=useRef(0),tiles=useRef({}),drawRef=useRef(null);
  var D=useRef({}),wid=useRef(null),first=useRef(true),lock=useRef(null),trk=useRef(track),kmR=useRef(0),recR=useRef(false),tt=useRef(0);
  D.current={marks:marks,track:track,me:me};

  function save(){try{localStorage.setItem('delta',JSON.stringify({marks:D.current.marks,track:D.current.track,lat:V.current.lat,lng:V.current.lng,z:V.current.z}))}catch(e){}}
  function req(){if(!raf.current)raf.current=requestAnimationFrame(function(){raf.current=0;if(drawRef.current)drawRef.current()})}
  function say(t){setToast(t);clearTimeout(tt.current);tt.current=setTimeout(function(){setToast('')},1800)}
  function tile(z,x,y){var sat=satR.current,k=(sat?'s/':'o/')+z+'/'+x+'/'+y,T=tiles.current;if(T[k])return T[k];var im=new Image();im.onload=function(){im.ok=1;req()};im.onerror=function(){};
    im.src=sat?'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/'+z+'/'+y+'/'+x:'https://tile.openstreetmap.org/'+z+'/'+x+'/'+y+'.png';T[k]=im;return im}

  drawRef.current=function(){
    var c=cv.current;if(!c)return;var ctx=c.getContext('2d'),w=c.width/dpr,h=c.height/dpr,v=V.current,d=D.current;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle=css('--bg');ctx.fillRect(0,0,w,h);
    var cc=px(v.lat,v.lng,v.z),ox=cc.x-w/2,oy=cc.y-h/2;
    ctx.strokeStyle=css('--grid');ctx.lineWidth=1;ctx.beginPath();
    for(var gx=-(ox%64);gx<w;gx+=64){ctx.moveTo(gx,0);ctx.lineTo(gx,h)}
    for(var gy=-(oy%64);gy<h;gy+=64){ctx.moveTo(0,gy);ctx.lineTo(w,gy)}
    ctx.stroke();
    var zt=Math.max(0,Math.min(18,Math.round(v.z))),s=Math.pow(2,v.z-zt),ts=256*s,n=Math.pow(2,zt);
    for(var tx=Math.floor(ox/ts);tx<=Math.floor((ox+w)/ts);tx++)for(var ty=Math.floor(oy/ts);ty<=Math.floor((oy+h)/ts);ty++){
      if(ty<0||ty>=n)continue;var im=tile(zt,((tx%n)+n)%n,ty);if(im.ok)ctx.drawImage(im,tx*ts-ox,ty*ts-oy,ts+.5,ts+.5)}
    function P(p){var q=px(p.lat,p.lng,v.z);return{x:q.x-ox,y:q.y-oy}}
    if(d.track.length>1){ctx.strokeStyle=css('--accent');ctx.lineWidth=4;ctx.lineJoin='round';ctx.beginPath();d.track.forEach(function(p,i){var q=P(p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.stroke()}
    d.marks.forEach(function(m){var q=P(m);ctx.fillStyle=css('--danger');ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(q.x,q.y,8,0,7);ctx.fill();ctx.stroke();
      ctx.font='600 13px system-ui';ctx.lineWidth=3;ctx.strokeStyle=css('--bg');ctx.strokeText(m.name,q.x+12,q.y+5);ctx.fillStyle=css('--fg');ctx.fillText(m.name,q.x+12,q.y+5)});
    if(d.me){var q=P(d.me);ctx.fillStyle='rgba(10,124,140,.25)';ctx.beginPath();ctx.arc(q.x,q.y,18,0,7);ctx.fill();
      ctx.fillStyle='#0a7c8c';ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(q.x,q.y,8,0,7);ctx.fill();ctx.stroke()}
    var mpp=156543.03*Math.cos(v.lat*Math.PI/180)/Math.pow(2,v.z),m100=100*mpp,nv=NICE[0];
    NICE.forEach(function(x){if(x<=m100*1.4)nv=x});
    if(sc.current)sc.current.style.width=(nv/mpp)+'px';
    if(scl.current)scl.current.textContent=nv>=1000?(nv/1000)+' km':nv+' m';
  };

  function zoomAt(sx,sy,nz){var v=V.current;nz=Math.max(3,Math.min(19,nz));var w=cv.current.clientWidth,h=cv.current.clientHeight,c=px(v.lat,v.lng,v.z),
    wx=c.x+(sx-w/2),wy=c.y+(sy-h/2),g=ll(wx,wy,v.z),k=px(g.lat,g.lng,nz),p=ll(k.x-(sx-w/2),k.y-(sy-h/2),nz);
    v.lat=Math.max(-85,Math.min(85,p.lat));v.lng=p.lng;v.z=nz;req()}

  useEffect(function(){
    var c=cv.current,G={ptr:{},last:null,lastTap:0,pinch:null},v=V.current;
    function pos(e){var r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
    function size(){var r=c.getBoundingClientRect();c.width=r.width*dpr;c.height=r.height*dpr;req()}
    function down(e){c.setPointerCapture(e.pointerId);G.ptr[e.pointerId]=pos(e);G.last={t:Date.now(),moved:0};G.pinch=null}
    function move(e){var p=G.ptr[e.pointerId];if(!p)return;var np=pos(e),ids=Object.keys(G.ptr);
      if(ids.length===2){G.ptr[e.pointerId]=np;var a=G.ptr[ids[0]],b=G.ptr[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
        if(G.pinch){zoomAt(mx,my,v.z+Math.log2(d/G.pinch.d));var c1=px(v.lat,v.lng,v.z),q=ll(c1.x-(mx-G.pinch.x),c1.y-(my-G.pinch.y),v.z);v.lat=q.lat;v.lng=q.lng}
        G.pinch={d:d,x:mx,y:my};if(G.last)G.last.moved=99;return}
      var dx=np.x-p.x,dy=np.y-p.y;if(G.last)G.last.moved+=Math.abs(dx)+Math.abs(dy);
      var c2=px(v.lat,v.lng,v.z),q2=ll(c2.x-dx,c2.y-dy,v.z);v.lat=Math.max(-85,Math.min(85,q2.lat));v.lng=q2.lng;G.ptr[e.pointerId]=np;req()}
    function up(e){var np=pos(e);delete G.ptr[e.pointerId];G.pinch=null;
      if(!Object.keys(G.ptr).length){if(G.last&&G.last.moved<8&&Date.now()-G.last.t<300){var n=Date.now();if(n-G.lastTap<320){zoomAt(np.x,np.y,v.z+1);G.lastTap=0}else G.lastTap=n}save()}}
    function wheel(e){e.preventDefault();var p=pos(e);zoomAt(p.x,p.y,v.z-e.deltaY*0.002);save()}
    function vis(){if(document.visibilityState==='visible'&&recR.current)wake()}
    c.addEventListener('pointerdown',down);c.addEventListener('pointermove',move);c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
    c.addEventListener('wheel',wheel,{passive:false});window.addEventListener('resize',size);document.addEventListener('visibilitychange',vis);
    size();
    return function(){c.removeEventListener('pointerdown',down);c.removeEventListener('pointermove',move);c.removeEventListener('pointerup',up);c.removeEventListener('pointercancel',up);
      c.removeEventListener('wheel',wheel);window.removeEventListener('resize',size);document.removeEventListener('visibilitychange',vis)}
  },[]);

  useEffect(function(){req();save()},[marks,track,me]);

  function wake(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){lock.current=l}).catch(function(){})}catch(e){}}
  function startGPS(){
    if(!navigator.geolocation){say('Sin geolocalización en este navegador');return}
    if(wid.current!==null)return;
    wid.current=navigator.geolocation.watchPosition(function(p){
      var np={lat:p.coords.latitude,lng:p.coords.longitude};
      if(recR.current&&p.coords.accuracy<50){var t=trk.current;if(t.length)kmR.current+=dist(t[t.length-1],np);trk.current=t.concat([np]);setTrack(trk.current);setKm(kmR.current)}
      setMe(np);
      if(first.current){V.current.lat=np.lat;V.current.lng=np.lng;V.current.z=Math.max(V.current.z,14);first.current=false}
      var sp=p.coords.speed;setSpd(sp!=null&&sp>=0?(sp*1.94384).toFixed(1):'0.0');
    },function(){wid.current=null;say('No pude obtener tu ubicación. Revisá los permisos.')},{enableHighAccuracy:true,maximumAge:2000})}
  function locate(){var m=D.current.me;
    if(m){V.current.lat=m.lat;V.current.lng=m.lng;V.current.z=Math.max(V.current.z,15);req();save()}
    else{first.current=true;startGPS();say('Buscando tu posición…')}}
  function recOn(on){recR.current=on;setRec(on);
    if(on){trk.current=[];kmR.current=0;setTrack([]);setKm(0);startGPS();wake();say('Grabando. Dejá la pantalla encendida')}
    else{try{if(lock.current)lock.current.release()}catch(e){}lock.current=null}}
  function addMark(){var nm=name.trim()||('Punto '+(marks.length+1));
    setMarks(marks.concat([{name:nm,lat:V.current.lat,lng:V.current.lng}]));setName('');
    if(document.activeElement)document.activeElement.blur();say('Guardado: '+nm)}
  function goTo(m){V.current.lat=m.lat;V.current.lng=m.lng;V.current.z=Math.max(V.current.z,14);req();save()}
  function del(i){setMarks(marks.filter(function(_,j){return j!==i}))}
  function step(d){zoomAt(cv.current.clientWidth/2,cv.current.clientHeight/2,Math.round(V.current.z)+d);save()}

  function toggleSat(){satR.current=!satR.current;setSat(satR.current);req()}
  useEffect(function(){
    var alive=true;
    function go(){var v=V.current,m=D.current.me,la=m?m.lat:v.lat,lo=m?m.lng:v.lng;
      fetch('https://api.open-meteo.com/v1/forecast?latitude='+la.toFixed(3)+'&longitude='+lo.toFixed(3)+'&current=temperature_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m&wind_speed_unit=kn')
        .then(function(r){return r.json()}).then(function(j){if(alive&&j.current)setWx(j.current)}).catch(function(){})}
    go();var id=setInterval(go,600000);return function(){alive=false;clearInterval(id)}
  },[]);

  var dst=rec?'Grabando… '+(km/1.852).toFixed(2)+' mn':(km?(km/1.852).toFixed(2)+' mn recorridas':'Sin grabar');

  return html`<div id="app">
    <canvas ref=${cv}></canvas>
    <div className="cross"></div>
    <div className="hud"><b>${spd} nd</b><small>${dst}</small><div className="scale" ref=${sc}></div><small ref=${scl}></small>${wx?html`<small>Viento ${Math.round(wx.wind_speed_10m)} nd ${DIRS[Math.round(wx.wind_direction_10m/45)%8]} · ráf. ${Math.round(wx.wind_gusts_10m)}</small><small>${Math.round(wx.temperature_2m)} °C</small>`:null}<small>© ${sat?'Esri':'OpenStreetMap'}</small></div>
    <div className="fabs">
      <button className="fab" aria-label="Acercar" onClick=${function(){step(1)}}>+</button>
      <button className="fab" aria-label="Alejar" onClick=${function(){step(-1)}}>−</button>
      <button className="fab" aria-label="Mi posición" onClick=${locate}>◎</button>
      <button className="fab" aria-label="Satélite" onClick=${toggleSat}>${sat?'🗺':'🛰'}</button>
    </div>
    <div id="toast" className=${toast?'on':''}>${toast}</div>
    <div id="sheet" className=${open?'open':''}>
      <div id="handle" onClick=${function(){setOpen(!open)}}><i></i></div>
      <div className="row">
        ${rec
          ?html`<button className="btn rec" onClick=${function(){recOn(false)}}>Detener recorrido</button>`
          :html`<button className="btn" onClick=${function(){recOn(true)}}>Grabar</button>`}
        <button className="btn p" onClick=${addMark}>Marcar centro</button>
      </div>
      <div id="more">
        <div className="row"><input value=${name} placeholder="Nombre del punto (muelle, arroyo…)" enterKeyHint="done"
          onInput=${function(e){setName(e.target.value)}} onKeyDown=${function(e){if(e.key==='Enter')addMark()}} /></div>
        <div id="list">
          ${marks.length
            ?marks.map(function(m,i){return html`<div className="item" key=${i}>
                <span onClick=${function(){goTo(m)}}>${m.name}${me?html`<small> · ${dist(me,m).toFixed(1)} km</small>`:null}</span>
                <button aria-label="Borrar" onClick=${function(){del(i)}}>✕</button>
              </div>`})
            :html`<div className="empty">Todavía no marcaste ningún punto.</div>`}
        </div>
      </div>
    </div>
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
})();
</script>
</body>
</html>
