<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NaviMaps">
<meta name="theme-color" content="#0a7c8c">
<title>NaviMaps</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* ---------- Colores y tema ---------- */
:root{--bg:#eef3f4;--grid:#cfdcde;--fg:#13262b;--panel:#ffffff;--accent:#0a7c8c;--muted:#5d7479;--danger:#c0392b;
  --glass:color-mix(in srgb,var(--panel) 58%,transparent);
  /* Vidrio estilo iPhone: g = controles (muy transparentes), gp = paneles con texto (algo más cubiertos) */
  --g1:rgba(255,255,255,.34);--g2:rgba(255,255,255,.12);--gp1:rgba(255,255,255,.66);--gp2:rgba(255,255,255,.5);
  --gb:rgba(255,255,255,.62);--ghi:rgba(255,255,255,.9);--gsh:rgba(12,32,38,.16);--gtx:0 1px 1px rgba(255,255,255,.55);--chip:rgba(255,255,255,.42);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1d;--grid:#1d2f34;--fg:#e4eff1;--panel:#18272b;--accent:#35b6c7;--muted:#8ea8ad;--danger:#ef7a6c;--g1:rgba(40,54,58,.58);--g2:rgba(16,24,27,.46);--gp1:rgba(28,40,44,.74);--gp2:rgba(16,24,27,.62);--gb:rgba(255,255,255,.16);--ghi:rgba(255,255,255,.26);--gsh:rgba(0,0,0,.45);--gtx:0 1px 2px rgba(0,0,0,.55);--chip:rgba(255,255,255,.09);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a1d;--grid:#1d2f34;--fg:#e4eff1;--panel:#18272b;--accent:#35b6c7;--muted:#8ea8ad;--danger:#ef7a6c;--g1:rgba(40,54,58,.58);--g2:rgba(16,24,27,.46);--gp1:rgba(28,40,44,.74);--gp2:rgba(16,24,27,.62);--gb:rgba(255,255,255,.16);--ghi:rgba(255,255,255,.26);--gsh:rgba(0,0,0,.45);--gtx:0 1px 2px rgba(0,0,0,.55);--chip:rgba(255,255,255,.09);color-scheme:dark}

/* ---------- Base ---------- */
*{-webkit-tap-highlight-color:transparent}
html,body,#root{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#app{position:relative;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-touch-callout:none}
input{flex:1;min-width:0;min-height:46px;padding:0 12px;border-radius:14px;border:1px solid var(--gb);background:var(--chip);color:var(--fg);font-size:16px;-webkit-user-select:text;user-select:text}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

/* Vidrio esmerilado */
.hud,.fab,.sb{background:linear-gradient(180deg,var(--g1),var(--g2));-webkit-backdrop-filter:blur(7px) saturate(200%) brightness(1.05);backdrop-filter:blur(7px) saturate(200%) brightness(1.05);
  border:1px solid var(--gb);box-shadow:inset 0 1px 0 var(--ghi),inset 0 -10px 18px -12px rgba(255,255,255,.45),0 8px 24px var(--gsh),0 1px 3px var(--gsh);text-shadow:var(--gtx)}
#sheet,#pincard,#riocard,#capascard,#menu,#sr{background:linear-gradient(180deg,var(--gp1),var(--gp2));-webkit-backdrop-filter:blur(20px) saturate(200%);backdrop-filter:blur(20px) saturate(200%);
  border:1px solid var(--gb);box-shadow:inset 0 1px 0 var(--ghi),0 12px 32px var(--gsh),0 2px 6px var(--gsh)}

/* ---------- Mapa: mira, datos y botones flotantes ---------- */
.hud{position:absolute;left:10px;top:68px;border-radius:18px;padding:9px 13px;display:flex;flex-direction:column;gap:4px;min-width:96px}
.hud b{font-size:20px;font-variant-numeric:tabular-nums}
.hud small{color:color-mix(in srgb,var(--fg) 74%,transparent);font-size:12px}
.scale{height:6px;border:2px solid var(--fg);border-top:none;margin-top:2px;box-sizing:content-box}
.fabs{position:absolute;right:10px;top:68px;display:flex;flex-direction:column;gap:8px}
.fab{width:48px;height:48px;border-radius:50%;color:var(--fg);font-size:22px;display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.9);background:linear-gradient(180deg,var(--g1),var(--g1))}
.fab,.sb,.hud{transition:transform .28s cubic-bezier(.3,1.6,.5,1),background .2s ease}
.fab .dot{width:18px;height:18px;border-radius:50%;background:var(--danger)}
.fab .sq{width:16px;height:16px;border-radius:3px;background:#fff}
.fab.recon{background:var(--danger);animation:latido 1.6s ease-in-out infinite}
@keyframes latido{50%{box-shadow:0 0 0 8px rgba(229,72,77,.25)}}
#pincard{position:absolute;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));border-radius:24px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;z-index:3;animation:sube .3s cubic-bezier(.2,.8,.2,1)}
@keyframes sube{from{opacity:0;transform:translateY(20px)}}
#riocard>*{flex:none}
#capascard{position:absolute;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));max-height:70%;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:24px;padding:0 14px 6px;z-index:5;animation:sube .3s cubic-bezier(.2,.8,.2,1);transition:transform .38s cubic-bezier(.2,.8,.2,1)}
#capascard.col{transform:translateY(calc(100% - 58px));overflow:hidden}
#capascard .grip{position:sticky;top:0;height:22px;margin:0 -14px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;z-index:1}
#capascard .grip i{width:40px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--fg) 30%,transparent)}
.fab.fabon{background:var(--accent);color:#fff;text-shadow:none}
.fab svg{display:block}
.zayuda{flex-basis:100%;color:var(--muted);font-size:12px;padding-top:4px}
/* ---------- Tutorial ---------- */
.tuto{position:absolute;inset:0;z-index:10;background:rgba(0,0,0,.28);animation:tutoIn .3s ease}
@keyframes tutoIn{from{opacity:0}}
.tuto.con-aro{background:transparent}
.tuto-aro{position:absolute;border:3px solid #fff;box-shadow:0 0 0 4px var(--accent),0 0 0 9999px rgba(0,0,0,.25);pointer-events:none;animation:aro 1.4s ease-in-out infinite;transition:all .35s cubic-bezier(.3,1.3,.5,1)}
@keyframes aro{50%{box-shadow:0 0 0 9px var(--accent),0 0 0 9999px rgba(0,0,0,.25)}}
.tuto-card{position:absolute;left:12px;right:12px;bottom:calc(18px + env(safe-area-inset-bottom));max-width:460px;margin:0 auto;border-radius:28px;padding:16px 18px 16px;
  background:linear-gradient(180deg,var(--gp1),var(--gp2));-webkit-backdrop-filter:blur(22px) saturate(200%);backdrop-filter:blur(22px) saturate(200%);
  border:1px solid var(--gb);box-shadow:inset 0 1px 0 var(--ghi),0 14px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:8px;animation:sube .35s cubic-bezier(.2,.8,.2,1)}
.tuto-top{display:flex;align-items:center;justify-content:space-between}
.tuto-e{font-size:38px;line-height:1}
.tuto-saltar{width:auto;padding:0 10px;font-size:15px;color:var(--muted)}
.tuto-t{font-size:21px}
.tuto-d{margin:0;font-size:16px;line-height:1.4}
.tuto-x{margin:0;font-size:14px;line-height:1.35;color:var(--muted)}
.tuto-pie{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.tuto-puntos{display:flex;gap:5px;flex-wrap:wrap}
.tuto-puntos i{width:7px;height:7px;border-radius:4px;background:var(--grid);transition:all .25s ease}
.tuto-puntos i.on{width:18px;background:var(--accent)}
.tuto-sig{flex:none;padding:0 22px}
.tuto-card{max-height:calc(100% - 90px);overflow-y:auto}
.tuto-media{position:relative;height:170px;border-radius:18px;overflow:hidden;background:var(--chip);flex:none;box-shadow:inset 0 0 0 1px var(--gb)}
.tuto-media img{width:100%;height:100%;object-fit:cover;display:block}
.an-map{position:absolute;inset:-25%;background-size:cover;background-position:center}
.an-cap{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.62);color:#fff;font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:10px}
.an .f{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:rgba(255,255,255,.75);border:2px solid rgba(0,0,0,.35);box-shadow:0 2px 8px rgba(0,0,0,.35)}
/* gestos: arrastrar, pellizcar, doble toque (9 s) */
.an-gestos .an-map{animation:g-map 9s ease-in-out infinite}
.an-gestos .f1{animation:g-f1 9s ease-in-out infinite}
.an-gestos .f2{animation:g-f2 9s ease-in-out infinite}
.an-gestos .an-fade{position:absolute;inset:0;background:var(--chip);opacity:0;animation:g-fade 9s linear infinite}
.an-gestos .an-cap{opacity:0}
.an-gestos .c1{animation:g-c1 9s linear infinite}.an-gestos .c2{animation:g-c2 9s linear infinite}.an-gestos .c3{animation:g-c3 9s linear infinite}
@keyframes g-map{0%,4%{transform:translateX(0) scale(1)}26%,31%{transform:translateX(-70px) scale(1)}33.3%,38%{transform:translateX(0) scale(1)}58%,64%{transform:scale(1.7)}66.6%,80%{transform:scale(1)}90%,98%{transform:scale(1.45)}100%{transform:scale(1)}}
@keyframes g-f1{0%{left:65%;top:55%;opacity:0}4%{left:65%;top:55%;opacity:1}26%{left:40%;top:55%;opacity:1}30%,33%{left:40%;top:55%;opacity:0}
  36%{left:44%;top:52%;opacity:1}58%{left:27%;top:38%;opacity:1}62%,66.6%{left:27%;top:38%;opacity:0}
  70%{left:50%;top:50%;opacity:1;transform:scale(1)}72%{transform:scale(.7)}74%{transform:scale(1)}76%{transform:scale(.7)}78%{transform:scale(1);opacity:1}82%,100%{left:50%;top:50%;opacity:0}}
@keyframes g-f2{0%,33%{left:56%;top:58%;opacity:0}36%{left:56%;top:58%;opacity:1}58%{left:73%;top:72%;opacity:1}62%,100%{left:73%;top:72%;opacity:0}}
@keyframes g-fade{0%,30%{opacity:0}32%{opacity:.85}35%,63%{opacity:0}65%{opacity:.85}68%,97%{opacity:0}99%{opacity:.85}100%{opacity:0}}
@keyframes g-c1{0%,31%{opacity:1}32%,100%{opacity:0}}@keyframes g-c2{0%,32%{opacity:0}34%,64%{opacity:1}65%,100%{opacity:0}}@keyframes g-c3{0%,65%{opacity:0}67%,98%{opacity:1}99%,100%{opacity:0}}
/* marcar un punto (6 s) */
.an-marcar .f{left:50%;top:50%;animation:m-f 6s ease infinite}
.an-marcar .an-ring{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;border:3px solid var(--accent);opacity:0;animation:m-ring 6s ease infinite}
.an-marcar .an-pin{position:absolute;left:50%;top:50%;margin:-34px 0 0 -13px;opacity:0;animation:m-pin 6s cubic-bezier(.3,1.5,.5,1) infinite}
.an-marcar .an-card{position:absolute;left:12px;right:12px;bottom:10px;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.9);color:#13262b;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.25);transform:translateY(130%);animation:m-card 6s cubic-bezier(.2,.8,.2,1) infinite}
.an-marcar .an-input{flex:1;border:1px solid #cfdcde;border-radius:8px;padding:3px 7px;color:#5d7479}
.an-marcar .an-btn{background:#0a7c8c;color:#fff;border-radius:8px;padding:4px 9px;font-weight:600}
.an-marcar .an-cap{top:10px;bottom:auto;animation:m-cap 6s linear infinite}
@keyframes m-f{0%{opacity:0;transform:scale(1)}8%{opacity:1}12%{transform:scale(.8)}40%{opacity:1;transform:scale(.8)}46%,100%{opacity:0;transform:scale(1)}}
@keyframes m-ring{0%,12%{opacity:0;transform:scale(.4)}38%{opacity:1;transform:scale(1)}44%,100%{opacity:0;transform:scale(1.3)}}
@keyframes m-pin{0%,40%{opacity:0;transform:translateY(-40px)}48%{opacity:1;transform:translateY(0)}92%{opacity:1}100%{opacity:0}}
@keyframes m-card{0%,52%{transform:translateY(130%)}62%,90%{transform:translateY(0)}100%{transform:translateY(130%)}}
@keyframes m-cap{0%,45%{opacity:1}52%,100%{opacity:0}}
/* cómo llegar: mantener apretado → Ir ahí → ruta → panel (14 s), con capturas reales */
.an-llegar{height:250px}
.an-llegar .cl{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
.an-llegar .cl1{animation:l-1 14s linear infinite}.an-llegar .cl2{animation:l-2 14s linear infinite}
.an-llegar .cl3{animation:l-3 14s ease infinite}.an-llegar .cl4{animation:l-4 14s linear infinite}
.an-llegar .an-cap{top:8px;bottom:auto;opacity:0}
.an-llegar .c1{top:auto;bottom:8px;animation:l-c1 14s linear infinite}.an-llegar .c2{animation:l-c2 14s linear infinite}
.an-llegar .c3{animation:l-c3 14s linear infinite}.an-llegar .c4{animation:l-c4 14s linear infinite}
.an-llegar .f{animation:l-f 14s ease infinite}
.an-llegar .an-ring{position:absolute;width:50px;height:50px;margin:-25px 0 0 -25px;left:56.4%;top:14.7%;border-radius:50%;border:3px solid var(--accent);opacity:0;animation:l-ring 14s ease infinite}
@keyframes l-1{0%,17%{opacity:1}19%,100%{opacity:0}}
@keyframes l-2{0%,17%{opacity:0}19%,38%{opacity:1}40%,100%{opacity:0}}
@keyframes l-3{0%,38%{opacity:0;transform:scale(1.08)}41%{opacity:1}64%{opacity:1;transform:scale(1)}66%,100%{opacity:0}}
@keyframes l-4{0%,64%{opacity:0}66%,98%{opacity:1}100%{opacity:0}}
@keyframes l-c1{0%,17%{opacity:1}18%,100%{opacity:0}}@keyframes l-c2{0%,18%{opacity:0}19%,38%{opacity:1}39%,100%{opacity:0}}
@keyframes l-c3{0%,39%{opacity:0}41%,64%{opacity:1}65%,100%{opacity:0}}@keyframes l-c4{0%,65%{opacity:0}67%,98%{opacity:1}99%,100%{opacity:0}}
@keyframes l-ring{0%,4%{opacity:0;transform:scale(.4)}14%{opacity:1;transform:scale(1)}17%,100%{opacity:0;transform:scale(1.3)}}
@keyframes l-f{0%{left:56.4%;top:14.7%;opacity:0;transform:scale(1)}3%{opacity:1}5%,15%{transform:scale(.8)}17%{opacity:1;transform:scale(1)}19%{left:56.4%;top:14.7%;opacity:0}
  22%{left:72%;top:89%;opacity:0}25%{opacity:1;transform:scale(1)}31%{left:72%;top:89%;transform:scale(.75)}34%{transform:scale(1);opacity:1}37%,66%{left:72%;top:89%;opacity:0}
  68%{left:50%;top:55%;opacity:0}74%{opacity:1;transform:scale(1)}82%{left:50%;top:55%;transform:scale(.75)}86%{transform:scale(1);opacity:1}92%,100%{left:50%;top:55%;opacity:0}}
/* capas: botón → estilos → colores → tocar zona → tarjeta (15 s), con capturas reales */
.an-capas{height:205px}
.an-capas .cl{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
.an-capas .k1{animation:k-1 15s linear infinite}.an-capas .k2{animation:k-2 15s linear infinite}.an-capas .k3{animation:k-3 15s linear infinite}
.an-capas .k4{animation:k-4 15s linear infinite}.an-capas .k5{animation:k-5 15s linear infinite}
.an-capas .an-cap{top:8px;bottom:auto;opacity:0}
.an-capas .q1{animation:k-q1 15s linear infinite}.an-capas .q2{animation:k-q2 15s linear infinite}.an-capas .q3{animation:k-q3 15s linear infinite}
.an-capas .q4{animation:k-q4 15s linear infinite}.an-capas .q5{top:auto;bottom:8px;animation:k-q5 15s linear infinite}
.an-capas .f{animation:k-f 15s ease infinite}
@keyframes k-1{0%,15%{opacity:1}17%,100%{opacity:0}}
@keyframes k-2{0%,15%{opacity:0}17%,35%{opacity:1}37%,100%{opacity:0}}
@keyframes k-3{0%,35%{opacity:0}37%,55%{opacity:1}57%,100%{opacity:0}}
@keyframes k-4{0%,55%{opacity:0}57%,73%{opacity:1}75%,100%{opacity:0}}
@keyframes k-5{0%,73%{opacity:0}75%,98%{opacity:1}100%{opacity:0}}

  20%{left:58%;top:40%;opacity:0}24%{opacity:1;transform:scale(1)}28%{left:58%;top:40%;transform:scale(.75)}31%{transform:scale(1);opacity:1}34%,57%{left:58%;top:40%;opacity:0}

/* grabar recorrido (6 s) */
.an-grabar .an-traza{position:absolute;inset:0;width:100%;height:100%}
.an-grabar .an-traza path{stroke-dasharray:100;stroke-dashoffset:100;animation:r-traza 6s linear infinite}
.an-grabar .an-boat{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#0a7c8c;border:3px solid #fff;box-shadow:0 0 0 6px rgba(10,124,140,.25);offset-path:path('M40 150 C 90 140, 110 100, 150 95 S 230 70, 250 55 S 300 30, 330 28');animation:r-boat 6s linear infinite}
.an-grabar .an-rec{position:absolute;right:10px;top:10px;display:flex;align-items:center;gap:6px;background:#e5484d;color:#fff;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:12px}
.an-grabar .an-rec i{width:8px;height:8px;border-radius:50%;background:#fff;animation:r-blink 1s steps(2) infinite}
@keyframes r-traza{0%,8%{stroke-dashoffset:100}85%,100%{stroke-dashoffset:0}}
@keyframes r-boat{0%,8%{offset-distance:0%}85%,100%{offset-distance:100%}}
@keyframes r-blink{50%{opacity:0}}
/* mapa <-> satélite (6 s) */
.an-sat .an-map,.an-marcar .an-map,.an-grabar .an-map{inset:0}
.an-sat .an-sat-img{animation:s-wipe 6s ease-in-out infinite}
.an-sat .an-linea{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.5);animation:s-linea 6s ease-in-out infinite}
.an-sat .an-yo{position:absolute;left:46%;top:52%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#0a7c8c;border:3px solid #fff;box-shadow:0 0 0 8px rgba(10,124,140,.25)}
@keyframes s-wipe{0%,15%{clip-path:inset(0 0 0 100%)}45%,65%{clip-path:inset(0 0 0 0)}95%,100%{clip-path:inset(0 0 0 100%)}}
@keyframes s-linea{0%,15%{left:100%}45%,65%{left:0%}95%,100%{left:100%}}
@media (prefers-reduced-motion:reduce){.an *{animation-duration:0s!important;animation-iteration-count:1!important}}
/* Atribución de los mapas: chiquita abajo a la izquierda, en una línea (no estira el recuadro de datos) */
.atrib{position:absolute;left:8px;bottom:calc(4px + env(safe-area-inset-bottom));max-width:calc(100% - 16px);font-size:9.5px;line-height:1.3;color:#333;background:rgba(255,255,255,.6);padding:1px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;z-index:1}
:root[data-theme="dark"] .atrib{color:#ddd;background:rgba(0,0,0,.45)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .atrib{color:#ddd;background:rgba(0,0,0,.45)}}
.estilos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;padding-top:8px}
.estilos .mini{padding:4px 6px;font-size:14px;line-height:1.15}
.zleg{display:flex;flex-wrap:wrap;gap:4px 12px;padding:4px 0 10px;font-size:12px;color:var(--muted)}
.zleg span{display:flex;align-items:center;gap:5px}
.zleg i{width:14px;height:6px;border-radius:3px;display:inline-block}
.rioh{border:none;background:none;padding:2px 0;margin:0;text-align:left;font:inherit;font-size:12px;color:var(--fg);cursor:pointer}
.hud .rioh b{font-size:12px;font-variant-numeric:tabular-nums}
#riocard{position:absolute;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));max-height:72%;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:24px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;z-index:4;animation:sube .3s cubic-bezier(.2,.8,.2,1)}
.chips.rioest{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.rioest .mini{flex:none;min-height:34px;padding:0 10px;font-size:13px}
.riobig{display:flex;align-items:center;gap:8px}
.riobig b{font-size:30px;font-variant-numeric:tabular-nums}
.riobig span{font-size:24px}
.riobig i{font-style:normal;color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:10px}
.riog{background:var(--chip);border-radius:12px;padding:6px 4px 4px}
.rioaviso{background:rgba(201,42,42,.12);border:1px solid rgba(201,42,42,.4);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.burger{position:absolute;left:10px;top:10px}
.compass{position:absolute;right:10px;top:10px}
.compass span{display:flex}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:.95}

/* ---------- Botones ---------- */
.btn{flex:1;min-height:48px;border:1px solid var(--gb);background:var(--chip);color:var(--fg);border-radius:16px;font-size:16px;font-weight:600;box-shadow:inset 0 1px 0 var(--ghi)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.rec{background:var(--danger);border-color:var(--danger);color:#fff}
.mini{min-height:40px;padding:0 14px;border:1px solid var(--gb);background:var(--chip);color:var(--fg);border-radius:14px;font-size:15px;box-shadow:inset 0 1px 0 var(--ghi)}
.mini.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:none}
.fab,.btn,.mini,.tab{transition:transform .2s ease,background .25s ease,color .25s ease}
.row{display:flex;gap:10px}
.seg{display:flex;gap:6px;align-items:center}

/* ---------- Panel inferior plegable ---------- */
#sheet{position:absolute;left:0;right:0;bottom:0;border-radius:26px 26px 0 0;padding:6px 12px 12px;display:flex;flex-direction:column;gap:8px;max-height:60%;overflow-y:auto;-webkit-overflow-scrolling:touch;transition:transform .38s cubic-bezier(.2,.8,.2,1),max-height .35s ease}
#sheet.col{transform:translateY(calc(100% - var(--peek,40px)));overflow:hidden}
#handle{min-height:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;touch-action:none;cursor:grab;flex:none}
#handle i{width:40px;height:5px;border-radius:3px;background:var(--grid)}
.sumtx{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.route{background:var(--chip);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.route small{color:var(--muted);font-size:12px}
.rr{display:flex;align-items:center;gap:10px}
.rr span{min-width:48px;text-align:center;font-variant-numeric:tabular-nums}

/* ---------- Menú lateral ---------- */
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:4}
#scrim.on{opacity:1;pointer-events:auto}
#menu{position:absolute;top:8px;bottom:8px;left:8px;width:min(86%,380px);transform:translateX(-108%);transition:transform .45s cubic-bezier(.3,1.25,.5,1);display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:28px;z-index:5;box-sizing:border-box}
#menu.open{transform:none}
.mh{display:flex;align-items:center;justify-content:space-between;font-size:18px}
.tabs{display:flex;gap:6px}
.tab{flex:1;min-height:38px;border:none;border-radius:10px;background:transparent;color:var(--muted);font-size:13px;font-weight:600}
.tab.on{background:var(--accent);color:#fff}
.mb{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
.mi,.lr{display:flex;align-items:center;gap:6px;min-height:50px;border-top:1px solid var(--grid)}
.lr{justify-content:space-between}
.mi span{flex:1;padding:8px 0}
.mi.sel{background:rgba(124,92,255,.14);border-radius:10px}
.ei{min-height:40px}
.sw{width:52px;height:30px;border-radius:15px;border:none;background:var(--grid);position:relative;transition:background .25s ease;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s ease}
.sw.on{background:var(--accent)}
.sw.on i{transform:translateX(22px)}

/* ---------- Buscador ---------- */
.sb{position:absolute;left:68px;right:68px;top:10px;height:48px;border-radius:24px;display:flex;align-items:center;gap:6px;padding:0 6px 0 14px;box-sizing:border-box;z-index:3}
.sb input{border:none;background:transparent;min-height:44px;padding:0;font-size:16px}
.clr{width:36px;height:36px;border:none;border-radius:50%;background:none;color:var(--muted);font-size:16px}
#sr{position:absolute;left:10px;right:10px;top:64px;max-height:52%;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:20px;padding:10px 12px;box-sizing:border-box;z-index:3;opacity:0;transform:translateY(-10px) scale(.98);pointer-events:none;transition:opacity .25s ease,transform .3s cubic-bezier(.2,.8,.2,1)}
#sr.on{opacity:1;transform:none;pointer-events:auto}
.srh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:8px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
